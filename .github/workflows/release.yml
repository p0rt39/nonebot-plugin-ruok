name: Release

# Two ways in:
#   - run this workflow manually: it bumps the version, commits it, tags master
#     and publishes. This is the normal path after a feature PR merges.
#   - push a v* tag by hand, which keeps the previous local-bump flow working.
#
# Scope: both entry points need repository write access. Contributors work up to
# opening a pull request; pull request CI is read-only and cannot reach this job.
#
# The test matrix lives in the pull request workflow. Here one Python version is
# enough: the only untested change since the PR is the version strings.
# Pushes made with GITHUB_TOKEN do not trigger further workflow runs, so the tag
# pushed below does not start a second copy of this workflow.
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      bump:
        description: "Version bump level; auto derives it from merged PR labels"
        type: choice
        default: auto
        options:
          - auto
          - patch
          - minor
          - major
      tag:
        description: "Re-publish this tag instead of bumping; leave empty for a new release"
        type: string
        default: ""
      dry_run:
        description: "Bump, test and build without pushing, publishing or creating a release"
        type: boolean
        default: false

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    name: Release
    runs-on: ubuntu-latest
    environment: release
    permissions:
      id-token: write
      contents: write
      # Needed by `gh pr list` when deriving the bump level from PR labels; an
      # explicit permissions block drops everything it does not list.
      pull-requests: read
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}
          # A re-publish run publishes the tag, not the branch head.
          ref: ${{ inputs.tag || github.ref }}

      - name: Setup uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
          python-version: "3.12"
          version: "latest"

      - name: Install Dependencies
        run: uv sync --locked

      # Two triggers in a row would otherwise publish a version with no changes.
      # Only guards a fresh bump; an explicit tag is always published on purpose.
      - name: Check for changes since the last release
        id: guard
        if: github.event_name == 'workflow_dispatch' && inputs.tag == ''
        run: |
          set -euo pipefail
          LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
          if [ -z "$LAST_TAG" ]; then
            echo "No previous release tag; everything counts as new."
            echo "skip=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          COUNT=$(git rev-list --count "$LAST_TAG"..HEAD)
          echo "Commits since $LAST_TAG: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "Nothing to release: HEAD is already at $LAST_TAG."
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "### Nothing to release" >> "$GITHUB_STEP_SUMMARY"
            echo "HEAD is already at \`$LAST_TAG\`; no new commits since that release." \
              >> "$GITHUB_STEP_SUMMARY"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      # auto: any merged major/breaking-change PR -> major, otherwise any
      # merged minor/enhancement PR -> minor, otherwise patch. Keep this
      # precedence in step with version-resolver in release-drafter.yml, so the
      # draft tag and the published version agree. Labels come from the
      # release-drafter autolabeler (branch names and titles).
      - name: Resolve bump level
        id: bump
        if: github.event_name == 'workflow_dispatch' && inputs.tag == '' && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          LEVEL="${{ inputs.bump }}"
          if [ "$LEVEL" = "auto" ]; then
            LAST_TAG=$(git describe --tags --abbrev=0 --match 'v*' 2>/dev/null || echo "")
            if [ -n "$LAST_TAG" ]; then
              SINCE=$(git log -1 --format=%ct "$LAST_TAG")
            else
              SINCE=$(git log --reverse --format=%ct | head -n 1)
            fi
            LABELS=$(gh pr list --state merged --limit 100 \
              --json mergedAt,labels \
              --jq ".[] | select((.mergedAt | fromdateiso8601) > $SINCE) | .labels[].name")
            echo "Labels merged after ${LAST_TAG:-<no previous tag>}: ${LABELS:-<none>}"
            if printf '%s\n' "$LABELS" | grep -qxE 'major|breaking-change'; then
              LEVEL=major
            elif printf '%s\n' "$LABELS" | grep -qxE 'minor|enhancement'; then
              LEVEL=minor
            else
              LEVEL=patch
            fi
          fi
          echo "level=$LEVEL" >> "$GITHUB_OUTPUT"

      - name: Bump version and tag
        id: bumped
        if: github.event_name == 'workflow_dispatch' && inputs.tag == '' && steps.guard.outputs.skip != 'true'
        env:
          LEVEL: ${{ steps.bump.outputs.level }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          NEXT=$(uv version --bump "$LEVEL" --dry-run --short)
          if git rev-parse -q --verify "refs/tags/v$NEXT" > /dev/null; then
            echo "Tag v$NEXT already exists; refusing to reuse it" >&2
            exit 1
          fi
          uv run bump-my-version bump "$LEVEL"
          if [ "${{ inputs.dry_run }}" != "true" ]; then
            git push origin "HEAD:master"
            git push origin "v$NEXT"
          else
            echo "Dry run: not pushing v$NEXT"
          fi
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"
          echo "version=$NEXT" >> "$GITHUB_OUTPUT"

      - name: Read tag version
        id: tagged
        if: github.event_name == 'push' || inputs.tag != ''
        env:
          TAG: ${{ inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Check Version
        if: steps.guard.outputs.skip != 'true'
        env:
          EXPECTED: ${{ steps.bumped.outputs.version || steps.tagged.outputs.version }}
        run: |
          set -euo pipefail
          ACTUAL=$(uv version --short)
          if [ "$EXPECTED" != "$ACTUAL" ]; then
            echo "Tag version $EXPECTED does not match project version $ACTUAL" >&2
            exit 1
          fi

      # Pull request CI already ran the full matrix; this re-check uses one
      # version to cover the bumped tree that gets published.
      - name: Run Tests
        if: steps.guard.outputs.skip != 'true'
        run: uv run poe test

      - name: Build
        if: steps.guard.outputs.skip != 'true'
        run: uv build

      - name: Publish to PyPI
        if: inputs.dry_run != true && steps.guard.outputs.skip != 'true'
        # Skip files that already reached the index so a retry after a late
        # failure (e.g. creating the GitHub Release) can finish the job.
        run: uv publish --check-url https://pypi.org/simple/

      - name: Create Release and Upload Assets
        if: inputs.dry_run != true && steps.guard.outputs.skip != 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.bumped.outputs.tag || steps.tagged.outputs.tag }}
        run: |
          set -euo pipefail
          # Release Drafter keeps a draft on the upcoming version name, and that
          # body carries the categories and template from release-drafter.yml.
          # Capture it before deleting the draft, so it can become the notes of
          # the published release.
          gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .body" \
            > release-notes.md

          # Delete that draft by id so an already published release with the
          # same tag is never touched (drafts and real releases can share a tag
          # name). `gh release view` resolves drafts too, so this has to happen
          # before the existence check below.
          DRAFT_ID=$(gh api "repos/$GITHUB_REPOSITORY/releases?per_page=50" \
            --jq ".[] | select(.draft and .tag_name == \"$TAG\") | .id" | head -n 1)
          if [ -n "$DRAFT_ID" ]; then
            gh api -X DELETE "repos/$GITHUB_REPOSITORY/releases/$DRAFT_ID"
          fi

          PUBLISHED=$(gh release view "$TAG" --json isDraft --jq '.isDraft' \
            2>/dev/null || echo missing)
          if [ "$PUBLISHED" = "false" ]; then
            # Retry of a run that already created the release.
            gh release upload "$TAG" dist/*.tar.gz dist/*.whl --clobber
            exit 0
          fi

          # An empty draft, or the "* No changes" body Release Drafter writes
          # when nothing was merged, would make useless notes; fall back to
          # GitHub's generated notes in that case.
          BODY=$(tr -d '[:space:]' < release-notes.md 2>/dev/null || true)
          if [ -n "$BODY" ] && [ "$BODY" != "*Nochanges" ]; then
            gh release create "$TAG" dist/*.tar.gz dist/*.whl \
              --title "$TAG" \
              --notes-file release-notes.md
          else
            echo "No usable draft notes for $TAG; falling back to generated notes." \
              >> "$GITHUB_STEP_SUMMARY"
            gh release create "$TAG" dist/*.tar.gz dist/*.whl \
              --title "$TAG" \
              --generate-notes
          fi
